[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbpe"
version = "0.1.0"
description = "Multidimensional BPE research implementation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "torch==2.3.0", "tqdm==4.66.4"]

[project.optional-dependencies]
images = ["torchvision==0.18.0", "pillow==10.3.0"]

[project.scripts]
mbpe = "mbpe.flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mbpe*"]
namespaces = false

[tool.setuptools.package-data]
mbpe = ["structure/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "studies"]
