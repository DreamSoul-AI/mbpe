name: CPU checks

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU regression
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU torch installation failed' }
          python -m pip install -e . psutil==5.9.8 pillow==10.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
      - name: Check package entry point
        run: python -B -m mbpe plan
      - name: Run offline CPU regression
        shell: pwsh
        run: |
          $env:TMP = Join-Path $env:GITHUB_WORKSPACE 'tmp'
          $env:TEMP = $env:TMP
          New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null
          python -B -c "import psutil, runpy; p = psutil.Process(); p.nice(psutil.IDLE_PRIORITY_CLASS); p.cpu_affinity(p.cpu_affinity()[:1]); runpy.run_path('tests/run.py', run_name='__main__')"
          if ($LASTEXITCODE -ne 0) { throw 'CPU regression failed' }
